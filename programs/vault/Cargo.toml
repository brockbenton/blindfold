[package]
name = "vault"
version = "0.1.0"
description = "Blindfold USDC vault"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", default-features = false, features = ["token", "associated_token", "token_2022", "solana-v3"] }

[dev-dependencies]
litesvm = "0.15.0"
litesvm-token = "=0.15.2"
base64 = "0.22"
solana-account = "4"
solana-clock = "3"
solana-instruction = "3"
solana-transaction-error = "3"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
