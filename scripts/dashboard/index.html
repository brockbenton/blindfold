<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindfold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #111112;
    --panel: #18181a;
    --raised: #212123;
    --line: rgba(237, 237, 237, 0.08);
    --text: #ededed;
    --text-2: #a1a1a6;
    --muted: #85858b;
    --red: #e5484d;
    --green: #4cc38a;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--text); font: 400 14px/20px var(--mono);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-rows: auto 1fr auto; gap: 24px; height: 100vh; max-width: 1600px; margin: 0 auto; padding: 32px; }

  /* Header */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font: 500 24px/32px var(--sans); }
  .act { color: var(--text-2); }

  /* Sides */
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-height: 0; }
  .side { display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .side > * { padding: 0 24px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; color: var(--text-2); }
  .head .name { font: 500 16px/24px var(--sans); color: var(--text); }
  .head .scheme { color: var(--muted); }

  .verdict { padding-top: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .verdict .who { color: var(--muted); }
  .verdict .action { font: 500 48px/56px var(--sans); letter-spacing: -0.02em; color: var(--muted); margin-top: 4px; transition: color 300ms var(--ease); }
  .verdict .detail { color: var(--text-2); margin-top: 4px; min-height: 20px; }
  .exact .verdict.on .action { color: var(--red); }
  .blind .verdict.on .action { color: var(--green); }

  .log { display: flex; flex-direction: column; min-height: 0; padding-top: 20px; }
  .section { display: flex; justify-content: space-between; color: var(--muted); padding-bottom: 8px; }
  .rows { flex: 1; min-height: 0; overflow: hidden; }
  .row { display: grid; grid-template-columns: 72px 1fr auto 64px; gap: 16px; align-items: center; height: 40px; border-top: 1px solid var(--line); animation: enter 400ms var(--ease) both; transition: background-color 150ms var(--ease); }
  .row:hover { background: var(--raised); }
  .row time { color: var(--muted); }
  .row .memo { color: var(--text-2); }
  .row .amt { text-align: right; }
  .addr { color: var(--text); }
  .exact .addr { color: var(--red); }
  .row .unknown { color: var(--muted); }
  .empty { color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

  .buys { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; padding-bottom: 20px; border-top: 1px solid var(--line); }
  .buys .label { color: var(--muted); }
  .ticks { display: flex; gap: 4px; flex: 1; }
  .tick { width: 12px; height: 12px; border-radius: 3px; background: transparent; border: 1px solid var(--text-2); animation: enter 300ms var(--ease) both; }
  .exact .tick { background: var(--red); border-color: var(--red); }
  .buys .where { color: var(--text-2); }
  .notes { padding: 12px 0 16px; display: flex; flex-direction: column; gap: 4px; }
  .notes:empty { display: none; }
  .note { color: var(--text-2); animation: enter 300ms var(--ease) both; }
  .note::before { content: "\2713"; color: var(--green); margin-right: 12px; }

  /* Status bar */
  footer { display: flex; gap: 40px; color: var(--muted); }
  footer b { color: var(--text); font-weight: 400; margin-left: 8px; }

  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 960px) {
    .app { height: auto; padding: 16px; gap: 16px; }
    header { flex-direction: column; gap: 8px; }
    main { grid-template-columns: 1fr; gap: 16px; }
    .side > * { padding-left: 16px; padding-right: 16px; }
    .verdict .action { font-size: 36px; line-height: 44px; }
    .row { grid-template-columns: 64px 1fr 56px; gap: 12px; }
    .row .memo, .row .unknown { display: none; }
    .rows { max-height: 280px; }
    footer { flex-wrap: wrap; gap: 8px 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Blindfold</h1>
    <span class="act" id="act">Waiting for the demo</span>
  </header>

  <main>
    <section class="side exact">
      <div class="head"><span class="name">Standard x402</span><span class="scheme">exact</span></div>
      <div class="verdict"><div class="who">watcher's signal</div><div class="action">watching</div><div class="detail"></div></div>
      <div class="log">
        <div class="section"><span>onchain</span><span class="count">0 txs</span></div>
        <div class="rows"></div>
      </div>
      <div>
        <div class="notes"></div>
        <div class="buys"><span class="label">purchases</span><span class="ticks"></span><span class="where">0</span></div>
      </div>
    </section>

    <section class="side blind">
      <div class="head"><span class="name">Blindfold</span><span class="scheme">cashu</span></div>
      <div class="verdict"><div class="who">watcher's signal</div><div class="action">watching</div><div class="detail"></div></div>
      <div class="log">
        <div class="section"><span>onchain</span><span class="count">0 txs</span></div>
        <div class="rows"></div>
      </div>
      <div>
        <div class="notes"></div>
        <div class="buys"><span class="label">purchases</span><span class="ticks"></span><span class="where">0</span></div>
      </div>
    </section>
  </main>

  <footer>
    <span>agent wallet<b id="b-exact">-</b></span>
    <span>agent tokens<b id="b-tokens">-</b></span>
    <span>feed earned<b id="b-provider">-</b></span>
    <span>vault<b id="b-vault">-</b></span>
    <span>watcher reads<b id="b-source">RPC polling</b></span>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const usd = (base) => "$" + (Number(base) / 1e6).toFixed(2);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const shortAddr = (a) => a.slice(0, 4) + "…" + a.slice(-4);
const hhmmss = (iso) => (iso ? new Date(iso).toISOString().slice(11, 19) : "--:--:--");
const sideEl = (s) => document.querySelector(s === "exact" ? ".exact" : ".blind");
let state;

function reset() {
  state = { exact: { txs: [], buys: 0 }, blindfold: { txs: [], buys: 0 } };
  for (const s of ["exact", "blindfold"]) {
    const el = sideEl(s);
    el.querySelector(".verdict").classList.remove("on");
    el.querySelector(".action").textContent = "watching";
    el.querySelector(".detail").textContent = "no transactions yet";
    el.querySelector(".rows").innerHTML = '<div class="empty">waiting for transactions</div>';
    el.querySelector(".count").textContent = "0 txs";
    el.querySelector(".ticks").innerHTML = "";
    el.querySelector(".where").textContent = "0";
    el.querySelector(".notes").innerHTML = "";
  }
}

/* What Copycat can say about the agent, from the exact payments it has seen. */
function exactDetail() {
  const txs = state.exact.txs.filter((t) => t.kind === "direct_payment");
  if (!txs.length) return "no transactions yet";
  const tags = txs.map((t) => /^([a-z-]+)\/([A-Z0-9]+)$/.exec(t.memo || "")).filter(Boolean);
  const feed = tags.length ? tags[0][1] : "paid";
  const token = tags.length ? " on " + tags[0][2] : "";
  const times = txs.map((t) => t.time && Date.parse(t.time)).filter(Boolean);
  const span = times.length > 1 ? " in " + Math.max(1, Math.round((Math.max(...times) - Math.min(...times)) / 1000)) + " s" : "";
  return txs.length + " " + feed + " read" + (txs.length === 1 ? "" : "s") + token + span + " · wallet " + shortAddr(txs[0].from);
}

const handlers = {
  act(e) { $("act").textContent = e.title; },
  call(e) {
    const s = state[e.side];
    s.buys++;
    const el = sideEl(e.side);
    const tick = e.url
      ? '<a class="tick" href="' + esc(e.url) + '" target="_blank" rel="noopener" title="' + esc(e.label) + '"></a>'
      : '<span class="tick" title="' + esc(e.label) + '"></span>';
    el.querySelector(".ticks").insertAdjacentHTML("beforeend", tick);
    el.querySelector(".where").textContent = s.buys + (e.side === "exact" ? " · onchain" : " · offchain");
  },
  chain(e) {
    const s = state[e.side];
    s.txs.push(e);
    const el = sideEl(e.side);
    const rows = el.querySelector(".rows");
    rows.querySelector(".empty")?.remove();
    let who, memo = "";
    if (e.kind === "direct_payment") {
      who = '<span class="addr">' + shortAddr(e.from) + "</span> → feed";
      memo = e.memo && e.memo.includes("/") ? esc(e.memo) : "";
    } else if (e.kind === "vault_payout") {
      who = 'vault → feed <span class="unknown">· payer unknown</span>';
    } else {
      who = 'deposit <span class="unknown">· ' + shortAddr(e.from) + "</span>";
    }
    rows.insertAdjacentHTML("afterbegin",
      '<a class="row" href="' + esc(e.url) + '" target="_blank" rel="noopener"><time>' + hhmmss(e.time) + "</time><span>" + who +
      '</span><span class="memo">' + memo + '</span><span class="amt">' + usd(e.amountBase) + "</span></a>");
    el.querySelector(".count").textContent = s.txs.length + (s.txs.length === 1 ? " tx" : " txs");
    if (e.side === "exact") el.querySelector(".detail").textContent = exactDetail();
  },
  copycat(e) {
    const el = sideEl(e.side);
    el.querySelector(".verdict").classList.add("on");
    el.querySelector(".action").textContent = e.side === "exact" ? e.action : "no signal";
    el.querySelector(".detail").textContent = e.side === "exact" ? exactDetail() : "nothing onchain names your agent";
  },
  balances(e) {
    $("b-exact").textContent = usd(e.exactWalletBase);
    $("b-tokens").textContent = "$" + (e.agentTokensCents / 100).toFixed(2);
    $("b-provider").textContent = usd(BigInt(e.providerDirectBase) + BigInt(e.providerSettledBase) + BigInt(e.providerOwedCents) * 10000n);
    $("b-vault").textContent = usd(e.vaultBase);
  },
  source(e) { $("b-source").textContent = e.text; },
  note(e) { sideEl(e.side).querySelector(".notes").insertAdjacentHTML("beforeend", '<div class="note">' + esc(e.text) + "</div>"); },
  done(e) { $("act").textContent = e.ok ? "Done" : "Stopped"; },
};

reset();
const es = new EventSource("/events");
es.onopen = () => reset();
es.onmessage = (m) => { const e = JSON.parse(m.data); (handlers[e.type] || (() => {}))(e); };
</script>
</body>
</html>
