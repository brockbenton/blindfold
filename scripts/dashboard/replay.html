<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindfold replay</title>
<meta name="description" content="A recorded run of Blindfold: private x402 payments for AI agents on Solana. Copycat, a bot reading public Solana data, front-runs standard x402 and sees nothing with Blindfold.">
<meta property="og:title" content="Blindfold replay">
<meta property="og:description" content="Watch a recorded Solana run: standard x402 leaks what your agent researches; Blindfold does not.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<style>
  .replay {
    display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr) auto;
    height: 100vh; height: 100dvh; max-width: 2000px; margin: 0 auto;
  }
  .replay .app { max-width: none; padding-right: 24px; padding-bottom: 24px; }

  /* Terminal narration */
  .term { display: flex; flex-direction: column; min-height: 0; margin: 32px 32px 24px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .term-head { display: flex; justify-content: space-between; gap: 16px; padding: 20px 24px 12px; color: var(--muted); }
  .term-head b { color: var(--text-2); font-weight: 400; }
  .term-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 20px; font-size: 13px; line-height: 20px; color: var(--text-2); scrollbar-width: thin; scrollbar-color: var(--raised) transparent; overflow-wrap: anywhere; }
  .term-body .l { animation: enter 300ms var(--ease) both; }
  .term-body .gap { height: 12px; }
  .term-body .title { color: var(--text); font: 500 15px/24px var(--sans); margin-bottom: 4px; }
  .term-body .sub { color: var(--muted); margin-bottom: 12px; }
  .term-body .step, .term-body .key { color: var(--muted); }
  .term-body .step { padding-left: 16px; }
  .term-body .kv { display: grid; grid-template-columns: 112px 1fr; gap: 12px; }
  .term-body .ok, .term-body .warn, .term-body .copycat, .term-body .agent { display: grid; grid-template-columns: 24px 1fr; gap: 12px; }
  .term-body .copycat, .term-body .agent { grid-template-columns: 64px 1fr; }
  .term-body .tag.ok { color: var(--green); }
  .term-body .tag.warn { color: var(--amber); }
  .term-body .tag.copycat { color: var(--red); }
  .term-body .tag.agent { color: var(--text); }
  .term-body .copycat > span:last-child { color: var(--text); }
  .term-body .err { color: var(--red); }
  .term-body a { color: var(--text); border-bottom: 1px solid var(--line); transition: border-color 150ms var(--ease); }
  .term-body a:hover { border-color: var(--text-2); }

  /* Controls */
  .controls { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 32px 24px; color: var(--muted); }
  .controls button {
    display: inline-grid; place-items: center; height: 32px; min-width: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text-2); font: inherit; cursor: pointer; transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .controls button:hover { background: var(--raised); color: var(--text); }
  .controls button:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; }
  .controls #play { width: 40px; height: 40px; border-radius: 20px; background: var(--text); color: var(--page); border-color: transparent; }
  .controls #play:hover { background: #fff; }
  .controls svg { width: 16px; height: 16px; fill: currentColor; }
  .group { display: flex; gap: 8px; }
  .speed button[aria-pressed="true"] { color: var(--text); background: var(--raised); border-color: rgba(237, 237, 237, 0.16); }
  .chapters { flex: 1; display: flex; gap: 4px; min-width: 0; }
  .chapters button { all: unset; flex: var(--w) 1 0; min-width: 6px; height: 32px; display: flex; align-items: center; cursor: pointer; }
  .chapters button:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; border-radius: 2px; }
  .chapters i { display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; transition: height 150ms var(--ease); }
  .chapters button:hover i, .chapters button.current i { height: 6px; }
  .chapters i::after { content: ""; display: block; height: 100%; width: var(--p, 0%); background: var(--text-2); }
  .chapters button.current i::after { background: var(--text); }
  .time { min-width: 96px; text-align: right; color: var(--text-2); }
  .meta { white-space: nowrap; }
  .meta a { color: var(--text-2); border-bottom: 1px solid var(--line); }
  .meta a:hover { color: var(--text); }
  .notice { position: fixed; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; color: var(--text-2); background: var(--page); }
  .notice[hidden] { display: none; }

  @media (max-width: 1280px) {
    .replay { grid-template-columns: minmax(0, 1fr) 340px; }
    .meta { display: none; }
  }
  @media (max-width: 960px) {
    .replay { display: flex; flex-direction: column; height: auto; }
    .replay .app { padding: 16px; }
    .term { order: -1; margin: 16px 16px 0; max-height: 40vh; min-height: 168px; }
    .term-head { padding: 16px 16px 8px; }
    .term-body { padding: 0 16px 16px; }
    .term-body .kv { grid-template-columns: 96px 1fr; }
    .controls {
      position: sticky; bottom: 0; z-index: 1; flex-wrap: wrap; gap: 8px 12px; padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--page); border-top: 1px solid var(--line);
    }
    .chapters { order: -1; flex-basis: 100%; }
    .time { min-width: 0; margin-left: auto; }
    .speed { gap: 4px; }
    .speed button { min-width: 28px; padding: 0 4px; }
  }
</style>
</head>
<body>
<div class="replay">
  <div id="dashboard"></div>
  <aside class="term" aria-label="Terminal narration">
    <div class="term-head"><span>terminal</span><b id="term-act"></b></div>
    <div class="term-body" id="term" aria-live="polite"></div>
  </aside>
  <div class="controls">
    <button id="play" aria-label="Play"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9.5-5.5z"/></svg></button>
    <div class="group">
      <button id="prev" aria-label="Previous act" title="Previous act (Left arrow)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h2v10H3zM14 3v10L6 8z"/></svg></button>
      <button id="next" aria-label="Next act" title="Next act (Right arrow)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3h2v10h-2zM2 3v10l8-5z"/></svg></button>
    </div>
    <div class="chapters" id="chapters" role="group" aria-label="Acts"></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <div class="group speed" role="group" aria-label="Playback speed">
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="2" aria-pressed="false">2×</button>
      <button data-speed="4" aria-pressed="false">4×</button>
    </div>
    <span class="meta" id="meta"></span>
  </div>
</div>
<div class="notice" id="notice" hidden></div>
<script type="module" src="replay.js"></script>
</body>
</html>
