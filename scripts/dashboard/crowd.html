<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindfold crowd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="crowd.css">
<style>
  /* A reload replays the run so far at once; only live events animate. */
  body.catchup * { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div id="dashboard"></div>
<script type="module">
import { mountCrowd } from "./crowd-dashboard.js";

const dashboard = mountCrowd(document.getElementById("dashboard"));
const es = new EventSource("events");
let timer;
es.onopen = () => {
  dashboard.reset();
  document.body.classList.add("catchup");
  clearTimeout(timer);
  timer = setTimeout(() => document.body.classList.remove("catchup"), 600);
};
es.onmessage = (m) => dashboard.apply(JSON.parse(m.data));
</script>
</body>
</html>
