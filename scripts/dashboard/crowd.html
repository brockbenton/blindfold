<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindfold crowd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same tokens as index.html, the main demo's dashboard. */
  :root {
    --page: #111112;
    --panel: #18181a;
    --raised: #212123;
    --line: rgba(237, 237, 237, 0.08);
    --text: #ededed;
    --text-2: #a1a1a6;
    --muted: #85858b;
    --red: #e5484d;
    --green: #4cc38a;
    --amber: #f0b03e;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--text); font: 400 14px/20px var(--mono);
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-rows: auto 1fr auto; gap: 24px; height: 100vh; max-width: 1600px; margin: 0 auto; padding: 32px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font: 500 24px/32px var(--sans); }
  h1 .q { color: var(--text-2); font-weight: 400; margin-left: 16px; }
  .act { color: var(--text-2); }

  main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-height: 0; }
  .side { display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .side > * { padding: 0 24px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding-top: 20px; color: var(--text-2); }
  .head .name { font: 500 16px/24px var(--sans); color: var(--text); }
  .head .scheme { color: var(--muted); }

  .verdict { padding-top: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .verdict .who { color: var(--muted); }
  .verdict .action { font: 500 48px/56px var(--sans); letter-spacing: -0.02em; color: var(--muted); margin-top: 4px; transition: color 300ms var(--ease); }
  .verdict .detail { color: var(--text-2); margin-top: 4px; min-height: 40px; }
  .verdict.alarm .action { color: var(--red); }
  .verdict.calm .action { color: var(--green); }
  .verdict.warn .action { color: var(--amber); }

  .log { display: flex; flex-direction: column; min-height: 0; padding-top: 20px; }
  .section { display: flex; justify-content: space-between; color: var(--muted); padding-bottom: 8px; }
  .rows { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .rows::-webkit-scrollbar { display: none; }
  .row { display: grid; gap: 16px; align-items: center; height: 34px; border-top: 1px solid var(--line); animation: enter 400ms var(--ease) both; transition: background-color 150ms var(--ease); }
  .row:hover { background: var(--raised); }
  .exact .row { grid-template-columns: 72px 112px 1fr 72px 96px; }
  .blind .row { grid-template-columns: 72px 1fr 1fr 72px; }
  .row .agent { color: var(--text); }
  .row .addr { color: var(--red); }
  .row .token { color: var(--text); }
  .row .sig { color: var(--red); text-align: right; }
  .row .amt { text-align: right; }
  .row .unknown, .row time { color: var(--muted); }
  .row.payout .what { color: var(--text-2); }
  .row.forced { background: rgba(240, 176, 62, 0.08); }
  .row.forced .unknown { color: var(--amber); }
  .divider { color: var(--muted); border-top: 1px solid var(--line); padding: 12px 0 8px; animation: enter 400ms var(--ease) both; }
  .empty { color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

  .buys { display: grid; gap: 8px; padding-top: 16px; padding-bottom: 20px; border-top: 1px solid var(--line); }
  .buys .label { color: var(--muted); }
  .lane { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center; }
  .lane .who { color: var(--text-2); }
  .lane .where { color: var(--muted); }
  .ticks { display: flex; gap: 4px; flex-wrap: wrap; }
  .tick { width: 12px; height: 12px; border-radius: 3px; background: transparent; border: 1px solid var(--text-2); animation: enter 300ms var(--ease) both; }
  .exact .tick { background: var(--red); border-color: var(--red); }

  footer { display: flex; gap: 40px; color: var(--muted); flex-wrap: wrap; }
  footer b { color: var(--text); font-weight: 400; margin-left: 8px; }

  /* A reload replays the run so far at once; only live events animate. */
  body.replay * { animation: none !important; transition: none !important; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 960px) {
    .app { height: auto; padding: 16px; gap: 16px; }
    header { flex-direction: column; gap: 8px; }
    h1 .q { display: block; margin-left: 0; }
    main { grid-template-columns: 1fr; gap: 16px; }
    .side > * { padding-left: 16px; padding-right: 16px; }
    .verdict .action { font-size: 36px; line-height: 44px; }
    .row { height: auto; min-height: 34px; padding: 6px 0; }
    .exact .row { grid-template-columns: 64px 1fr 72px; gap: 12px; }
    .exact .row .calls, .exact .row .token { display: none; }
    .blind .row { grid-template-columns: 72px 1fr 56px; gap: 12px; }
    .blind .row .unknown { display: none; }
    .rows { max-height: 320px; }
    footer { gap: 8px 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Blindfold<span class="q" id="q">Who is researching what?</span></h1>
    <span class="act" id="act">Waiting for the demo</span>
  </header>

  <main>
    <section class="side exact">
      <div class="head"><span class="name">Standard x402</span><span class="scheme">exact</span></div>
      <div class="verdict"><div class="who">watcher's answer</div><div class="action">watching</div><div class="detail"></div></div>
      <div class="log">
        <div class="section"><span>wallets Copycat profiled</span><span class="count">0 txs</span></div>
        <div class="rows"></div>
      </div>
      <div class="buys"><span class="label">purchases</span><div class="lanes"></div></div>
    </section>

    <section class="side blind">
      <div class="head"><span class="name">Blindfold</span><span class="scheme">blindfold</span></div>
      <div class="verdict"><div class="who">watcher's answer</div><div class="action">watching</div><div class="detail"></div></div>
      <div class="log">
        <div class="section"><span>the vault, as Copycat sees it</span><span class="count">0 txs</span></div>
        <div class="rows"></div>
      </div>
      <div class="buys"><span class="label">purchases</span><div class="lanes"></div></div>
    </section>
  </main>

  <footer>
    <span>agents<b id="b-agents">-</b></span>
    <span>agent tokens (offchain)<b id="b-tokens">-</b></span>
    <span>feed earned<b id="b-feed">-</b></span>
    <span>vault this run<b id="b-vault">-</b></span>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const usd = (base) => "$" + (Number(base) / 1e6).toFixed(2);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const shortAddr = (a) => a.slice(0, 4) + "…" + a.slice(-4);
const hhmmss = (iso) => (iso ? new Date(iso).toISOString().slice(11, 19) : "--:--:--");
const ex = document.querySelector(".exact");
const bl = document.querySelector(".blind");
let state;

function verdict(el, action, detail, tone) {
  const v = el.querySelector(".verdict");
  v.classList.remove("alarm", "calm", "warn");
  if (tone) v.classList.add(tone);
  v.querySelector(".action").textContent = action;
  v.querySelector(".detail").textContent = detail;
}

function reset() {
  state = { agents: [], exactTxs: 0, vaultTxs: 0, round2: false, deposits: {}, buys: { exact: [], blindfold: [] } };
  for (const el of [ex, bl]) {
    verdict(el, "watching", "no transactions yet");
    el.querySelector(".rows").innerHTML = '<div class="empty">waiting for transactions</div>';
    el.querySelector(".count").textContent = "0 txs";
    el.querySelector(".lanes").innerHTML = "";
  }
}

function lanes() {
  for (const [side, el] of [["exact", ex], ["blindfold", bl]]) {
    el.querySelector(".lanes").innerHTML = state.agents.map((a, i) =>
      '<div class="lane"><span class="who">Agent ' + esc(a.name) + '</span><span class="ticks" id="t-' + side + "-" + i + '"></span><span class="where" id="w-' + side + "-" + i + '">0</span></div>').join("");
  }
}

const agentOf = (wallet) => state.agents.findIndex((a) => a.wallet === wallet);

const handlers = {
  setup(e) {
    state.agents = e.agents;
    $("b-agents").textContent = e.agents.map((a) => a.name + " " + a.token).join(" · ");
    lanes();
  },
  act(e) { $("act").textContent = e.title; },
  call(e) {
    const list = state.buys[e.side];
    list[e.agent] = (list[e.agent] || 0) + 1;
    const tick = e.url
      ? '<a class="tick" href="' + esc(e.url) + '" target="_blank" rel="noopener" title="' + esc(e.label) + '"></a>'
      : '<span class="tick" title="' + esc(e.label) + '"></span>';
    $("t-" + e.side + "-" + e.agent)?.insertAdjacentHTML("beforeend", tick);
    const w = $("w-" + e.side + "-" + e.agent);
    if (w) w.textContent = list[e.agent] + (e.side === "exact" ? " · onchain" : " · offchain");
  },
  /* Copycat's per-wallet profile from exact payments: the left table is rebuilt from it. */
  exact(e) {
    const rows = ex.querySelector(".rows");
    const sorted = [...e.signals].sort((a, b) => agentOf(a.payer) - agentOf(b.payer));
    rows.innerHTML = sorted.map((s) => {
      const i = agentOf(s.payer);
      return '<div class="row" style="animation:none"><span class="agent">' + (i >= 0 ? "Agent " + esc(state.agents[i].name) : "?") + '</span><span class="addr">' + shortAddr(s.payer) +
        '</span><span class="token">' + esc(s.token ? "researching " + s.token : "token unknown") + '</span><span class="calls">' + s.calls + " reads</span>" +
        '<span class="sig">' + esc(s.action) + "</span></div>";
    }).join("") || '<div class="empty">waiting for transactions</div>';
    const named = e.signals.filter((s) => s.token).length;
    verdict(ex, named + " of " + state.agents.length + " named", sorted.map((s) => {
      const i = agentOf(s.payer);
      return (i >= 0 ? state.agents[i].name : "?") + " → " + (s.token || "?");
    }).join(" · ") + (e.final ? " · every wallet tied to its token" : ""), "alarm");
  },
  chain(e) {
    if (e.kind === "direct_payment") {
      state.exactTxs++;
      ex.querySelector(".count").textContent = state.exactTxs + (state.exactTxs === 1 ? " tx" : " txs");
      return;
    }
    state.vaultTxs++;
    const rows = bl.querySelector(".rows");
    rows.querySelector(".empty")?.remove();
    if (e.round === 2 && !state.round2) {
      state.round2 = true;
      rows.insertAdjacentHTML("beforeend", '<div class="divider">round 2 · uneven amounts</div>');
    }
    const row = e.kind === "vault_payout"
      ? '<a class="row payout" href="' + esc(e.url) + '" target="_blank" rel="noopener"><time>' + hhmmss(e.time) + '</time><span class="what">vault → feed, one batch</span><span class="unknown">payer unknown</span><span class="amt">' + usd(e.amountBase) + "</span></a>"
      : '<a class="row" data-from="' + esc(e.from) + '" data-round="' + e.round + '" href="' + esc(e.url) + '" target="_blank" rel="noopener"><time>' + hhmmss(e.time) + "</time><span>deposit " + shortAddr(e.from) +
        '</span><span class="unknown">agent ? · bought ?</span><span class="amt">' + usd(e.amountBase) + "</span></a>";
    rows.insertAdjacentHTML("beforeend", row);
    rows.scrollTop = rows.scrollHeight;
    bl.querySelector(".count").textContent = state.vaultTxs + (state.vaultTxs === 1 ? " tx" : " txs");
  },
  vault(e) {
    if (e.action === "CANNOT ATTRIBUTE") state.round1 = true;
    if (e.action === "CANNOT ATTRIBUTE") verdict(bl, "can't tell", "deposits in, one payout out: who bought what, and which token, unknown", "calm");
    else if (e.action === "NO SIGNAL") verdict(bl, "no signal", e.reason, "calm");
    else if (e.action === "PARTIAL") {
      verdict(bl, "amounts leak", (state.round1 ? "Equal deposits: can't tell. " : "") + "Uneven deposits: " + shortAddr(e.forced[0]) + " must have paid the feed. Token: unknown", "warn");
      for (const f of e.forced) {
        for (const r of bl.querySelectorAll('.row[data-round="' + e.round + '"][data-from="' + f + '"]')) {
          r.classList.add("forced");
          r.querySelector(".unknown").textContent = "must have paid the feed";
        }
      }
    } else verdict(bl, e.action.toLowerCase(), e.reason, "alarm");
  },
  tokens(e) { $("b-tokens").textContent = e.cents.map((c, i) => (state.agents[i]?.name ?? "?") + " $" + (c / 100).toFixed(2)).join(" · "); },
  feed(e) { $("b-feed").textContent = usd(e.earnedBase); $("b-vault").textContent = "+" + usd(e.vaultBase); },
  done(e) { $("act").textContent = e.ok ? "Done" : "Stopped"; },
};

reset();
const es = new EventSource("/events");
let replayTimer;
es.onopen = () => {
  reset();
  document.body.classList.add("replay");
  clearTimeout(replayTimer);
  replayTimer = setTimeout(() => document.body.classList.remove("replay"), 600);
};
es.onmessage = (m) => { const e = JSON.parse(m.data); (handlers[e.type] || (() => {}))(e); };
</script>
</body>
</html>
