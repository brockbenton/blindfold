<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blindfold · Glass Map</title>
  <meta name="description" content="The Blindfold crowd run, stage by stage: what three agents bought, next to what a public-chain observer could infer.">
  <link rel="preload" href="fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../dashboard.css">
  <link rel="stylesheet" href="glass-map.css">
</head>
<body>
  <a class="skip" href="#gm-main">skip to the map</a>
  <div class="gm" id="gm">
    <header class="gm-head">
      <p class="wordmark">Blindfold <span>Glass Map</span></p>
      <nav class="stages" aria-label="stages">
        <button type="button" class="step" id="gm-prev" aria-label="previous stage (left arrow)">←</button>
        <ol class="scenes" id="gm-scenes"></ol>
        <button type="button" class="step" id="gm-next" aria-label="next stage (right arrow)">→</button>
      </nav>
    </header>

    <main id="gm-main" tabindex="-1">
      <section class="hero">
        <div class="hero-text">
          <span class="dash" aria-hidden="true"></span>
          <h1 class="headline" id="gm-scene"></h1>
          <p class="caption" id="gm-caption"></p>
        </div>
        <div class="score" id="gm-result" aria-live="polite"></div>
      </section>

      <div class="map" id="gm-map">
        <section class="col truth-col" aria-labelledby="gm-truth-h">
          <div class="col-head">
            <p class="side-label side-private">Private</p>
            <h2 id="gm-truth-h">What each agent did</h2>
            <p class="col-sub">Only the agent knows this.</p>
          </div>
        </section>
        <section class="col rail-col" aria-labelledby="gm-rail-h">
          <div class="col-head">
            <p class="side-label">Boundary</p>
            <h2 id="gm-rail-h">On chain?</h2>
          </div>
        </section>
        <section class="col public-col" aria-labelledby="gm-public-h">
          <div class="col-head">
            <p class="side-label side-public">Public</p>
            <h2 id="gm-public-h">What the observer sees, and concludes</h2>
            <p class="col-sub" id="gm-feed"></p>
          </div>
        </section>
      </div>

      <details class="trace">
        <summary>Full event trace <span class="trace-sum" id="gm-trace-sum"></span></summary>
        <div class="table-wrap" id="gm-trace"></div>
      </details>
    </main>
  </div>
  <script type="module" src="glass-map.js"></script>
</body>
</html>
