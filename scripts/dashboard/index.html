<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blindfold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div id="dashboard"></div>
<script type="module">
import { mountDashboard } from "./dashboard.js";

const dashboard = mountDashboard(document.getElementById("dashboard"));
const es = new EventSource("events");
es.onopen = () => dashboard.reset();
es.onmessage = (m) => dashboard.apply(JSON.parse(m.data));
</script>
</body>
</html>
